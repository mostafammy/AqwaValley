name: Sync QStash Cron Schedules

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qstash-cron-sync-main
  cancel-in-progress: false

jobs:
  sync:
    name: Reconcile QStash schedules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
      APP_URL: ${{ secrets.APP_URL }}

    steps:
      - name: Validate required secrets
        run: |
          if [ -z "$QSTASH_TOKEN" ]; then
            echo "Missing required secret: QSTASH_TOKEN"
            exit 1
          fi
          if [ -z "$APP_URL" ]; then
            echo "Missing required secret: APP_URL"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync QStash schedules
        run: pnpm -s cron:sync:qstash
